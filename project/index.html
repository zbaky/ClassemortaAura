<html lang="it">
  <head>
    <meta charset="UTF-8">
    <title>My App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
  
      body {
        display: flex;
        justify-content: center; /* Centra in orizzontale */
        align-items: center;     /* Centra in verticale */
        min-height: 100vh;       /* Prende il 100% dell'altezza dello schermo */
        margin: 0;               /* Rimuove i margini predefiniti del browser */
        background-color: #f0f2f5; /* Sfondo della pagina opzionale */
      }

      .Contenitore {
        width: 100%;             /* Permette al contenitore di essere responsivo */
        max-width: 500px;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
        background-color: #f9f9f9;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1); /* Ombra opzionale per dare profondità */
      }
    </style>
  </head>
  <body>

    <div class="Contenitore">

     <h1 align="center">Accesso</h1>
     <br>
      <form>
        <div class="mb-3">
          <label for="exampleInputEmail1" class="form-label">Username</label>
          <input type="text" class="form-control" id="exampleInputEmail1">
        </div>

          <div class="mb-3">
          <label for="exampleInputEmail1" class="form-label">Password</label>
          <input type="password" class="form-control" id="exampleInputEmail1">
        </div>


        <!-- Sezione Genere (Sostituisce la password) -->
        <div class="mb-4">
          <label class="form-label d-block">Genere</label>
          
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="gender" id="genderMaschio" value="maschio">
            <label class="form-check-label" for="genderMaschio">Maschio</label>
          </div>
          
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="gender" id="genderFemmina" value="femmina">
            <label class="form-check-label" for="genderFemmina">Femmina</label>
          </div>
          
          <div class="form-check mt-2">
            <input class="form-check-input" type="radio" name="gender" id="genderNonSpecificato" value="non-specificato" checked>
            <label class="form-check-label" for="genderNonSpecificato">Preferisco non specificare</label>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100">Invia</button> <!-- w-100 rende il bottone largo quanto il form -->
      </form>
    </div>

  </body>
</html>
