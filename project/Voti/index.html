<html>
    <head>
        <title>Gestione Voti</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <div class="container mt-5">
            <h1>Gestione Voti</h1>
            <form>
                <div class="mb-3">
                    <label for="voto" class="form-label">Voto</label>
                    <input type="number" class="form-control" id="voto" placeholder="Inserisci il voto">
                </div>
                <div class="mb-3">
                    <label for="materia" class="form-label">Materia</label>
                    <input type="text" class="form-control" id="materia" placeholder="Inserisci la materia">
                </div>
                <button type="submit" class="btn btn-primary" onclick="Invia()">Invia</button>
                <button type="button" class="btn btn-danger" onclick="Indietro()">Torna indietro</button>
            </form>
            <div class="container-sm">
            <div class="row">
                <div class="col">
                    <input type="text" class="form-control" placeholder="Voto" id="votoS">
                </div>
                <div class="col">
                    <input type="text" class="form-control" placeholder="Materia" id="materiaS">
                </div>
            </div>
            </div>
    </body>
</html>
