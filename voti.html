<html>
    <head>
        <title>Gestione Voti</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <div class="container mt-5">
            <h1>Gestione Voti</h1>
            <form id="formVoti">
                <div class="mb-3">
                    <label for="voto" class="form-label">Voto</label>
                    <input type="number" class="form-control" id="voto" placeholder="Inserisci il voto" required>
                </div>
                <div class="mb-3">
                    <label for="materia" class="form-label">Materia</label>
                    <input type="text" class="form-control" id="materia" placeholder="Inserisci la materia" required>
                </div>
                <button type="submit" class="btn btn-primary">Invia</button>
                <button type="button" class="btn btn-danger" onclick="window.location.href='project/index.html';">Torna indietro</button>
            </form>

            <div class="container-sm mt-4">
                <div id="listaVoti">
                    <div class="row mb-2 border rounded p-2">
                        <div class="col">
                            <b><input type="text" class="form-control" placeholder="Voto" id="votoS" disabled></b>
                        </div>
                        <div class="col">
                            <b><input type="text" class="form-control" placeholder="Materia" id="materiaS" disabled></b>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-4 p-3 border rounded bg-light">
                <h4>Media voti</h4>
                <p class="mb-0"><strong id="mediaVoti">0</strong></p>
            </div>
        </div>

        <script src="project/script.js"></script>
    </body>
</html>
